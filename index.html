<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Bridal and Fashion Studio (concept demo)</title>
<meta name="description" content="Concept demo of a bilingual bridal boutique website. Placeholder images and sample text.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Jost:wght@300;400&family=Noto+Naskh+Arabic:wght@400;500&family=Noto+Sans+Arabic:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F5F3; --ink:#262626; --stone:#68655F; --rule:#D8D7D2; --deep:#2E2D2B;
    --t1:#E6E3DD; --t2:#D5D2CB; --t3:#C4C1BA; --t4:#DDDBD6; --t5:#CBC8C0;
    --serif:"Bodoni Moda","Times New Roman",serif; --sans:"Jost",system-ui,sans-serif;
    --pad:clamp(20px,5vw,64px);
  }
  :root[lang="ar"]{ --serif:"Noto Naskh Arabic","Times New Roman",serif; --sans:"Noto Sans Arabic",system-ui,sans-serif; }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);font:300 1rem/1.7 var(--sans);-webkit-font-smoothing:antialiased}
  :root[lang="ar"] body{line-height:1.9}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .wrap{padding-inline:var(--pad)}
  h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}

  .notice{background:var(--deep);color:#E9E8E4;font-size:.8125rem;padding:8px var(--pad);text-align:center}

  header.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px}
  .mark{font-family:"Bodoni Moda",serif;font-size:1.375rem;text-decoration:none;direction:ltr}
  nav.links{display:none;gap:32px;font-size:.9375rem}
  nav.links a{text-decoration:none;padding:6px 0;border-bottom:1px solid transparent}
  nav.links a:hover{border-color:var(--ink)}
  @media(min-width:760px){nav.links{display:flex}}
  .tools{display:flex;align-items:center;gap:20px}
  .lang{background:none;border:0;font:inherit;font-size:.9375rem;cursor:pointer;min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:4px}

  /* hero */
  .hero{position:relative;min-height:calc(100svh - 100px);min-height:calc(100dvh - 100px);display:grid;align-items:end;background:linear-gradient(165deg,#EAE7E1 0%,#D2CFC8 100%);overflow:hidden}
  .hero .ph-note{position:absolute;inset-block-start:20px;inset-inline-end:var(--pad);font-size:.8125rem;color:var(--stone)}
  .hero-in{padding:0 var(--pad) clamp(28px,6vw,64px)}
  .word{font-family:"Bodoni Moda",serif;font-weight:400;font-size:clamp(5rem,26vw,17rem);line-height:.82;letter-spacing:-.03em;margin:0;direction:ltr;text-align:start;animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
  .sub{margin:18px 0 0;font-size:clamp(1rem,2.2vw,1.25rem);max-width:34ch}
  .cta-row{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:28px;align-items:center}
  .btn{display:inline-flex;align-items:center;min-height:48px;padding:0 28px;background:var(--ink);color:var(--paper);text-decoration:none;font-size:.9375rem;border:1px solid var(--ink);cursor:pointer;font-family:inherit}
  .btn:hover{background:transparent;color:var(--ink)}
  .link{font-size:.9375rem;text-underline-offset:5px}
  @keyframes rise{from{opacity:0;transform:translateY(22px);letter-spacing:.02em}to{opacity:1;transform:none;letter-spacing:-.03em}}

  section{padding-block:clamp(64px,10vw,140px)}
  .statement{max-width:1100px}
  .statement p{font-family:var(--serif);font-size:clamp(1.75rem,4.6vw,3.5rem);line-height:1.2;margin:0;max-width:24ch}
  :root[lang="ar"] .statement p{line-height:1.6}

  /* collections */
  .coll{display:grid;gap:32px}
  @media(min-width:900px){.coll{grid-template-columns:1.15fr .85fr;gap:72px;align-items:start}}
  .coll h2,.look h2,.book h2,.steps h2{font-size:clamp(1.5rem,3vw,2rem);margin-bottom:28px}
  .rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
  .rows button{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:16px;background:none;border:0;border-bottom:1px solid var(--rule);padding:22px 0;cursor:pointer;color:var(--ink);text-align:start;font-family:var(--serif);font-size:clamp(1.75rem,4.4vw,3.25rem);line-height:1.1}
  .rows button span{font-family:var(--sans);font-size:.875rem;color:var(--stone)}
  .rows button[aria-pressed="true"]{padding-inline-start:18px}
  .rows button{transition:padding .35s ease,opacity .2s}
  .rows:has(button:hover) button:not(:hover):not(:focus-visible){opacity:.45}
  .preview{position:relative;aspect-ratio:4/5;background:var(--t1);transition:background .5s ease;display:flex;align-items:flex-end;padding:20px}
  @media(min-width:900px){.preview{position:sticky;top:96px}}
  .preview small{font-size:.8125rem;color:var(--stone)}

  /* lookbook */
  .look-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(min-width:900px){.look-grid{grid-template-columns:repeat(12,1fr);gap:20px}}
  .frame{background:var(--t2);display:flex;align-items:flex-end;padding:14px;font-size:.8125rem;color:var(--stone)}
  .f1{aspect-ratio:3/4;background:var(--t1)}.f2{aspect-ratio:3/4;background:var(--t3)}
  .f3{aspect-ratio:1/1;background:var(--t4);grid-column:1/-1}.f4{aspect-ratio:3/4;background:var(--t5)}.f5{aspect-ratio:3/4;background:var(--t2)}
  @media(min-width:900px){
    .f1{grid-column:1/5;aspect-ratio:3/4}
    .f2{grid-column:5/9;aspect-ratio:3/4;margin-top:72px}
    .f3{grid-column:9/13;aspect-ratio:3/4}
    .f4{grid-column:3/7;aspect-ratio:4/5}
    .f5{grid-column:8/12;aspect-ratio:4/5;margin-top:56px}
  }

  /* fitting steps: a real sequence */
  .steps{background:#EDECE9}
  .steps ol{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--rule)}
  .steps li{display:grid;grid-template-columns:44px 1fr;gap:8px 16px;padding:26px 0;border-bottom:1px solid var(--rule)}
  @media(min-width:900px){.steps ol{grid-template-columns:repeat(3,1fr);border-top:0}.steps li{display:block;padding:0 32px 0 0;border:0;border-top:1px solid var(--ink);padding-top:22px;margin-inline-end:32px}}
  .steps .n{font-family:"Bodoni Moda",serif;font-size:1.25rem;color:var(--stone)}
  .steps h3{font-size:1.5rem;margin-bottom:8px}
  .steps p{margin:0;color:var(--stone);max-width:36ch}

  /* booking */
  .book-grid{display:grid;gap:56px}
  @media(min-width:900px){.book-grid{grid-template-columns:1fr 1fr;gap:96px}}
  form{display:grid;gap:22px;max-width:520px}
  label{display:grid;gap:6px;font-size:.9375rem;color:var(--stone)}
  input,select,textarea{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:10px 0;min-height:48px;width:100%}
  textarea{min-height:96px;resize:vertical}
  input:focus-visible,select:focus-visible,textarea:focus-visible{outline:0;border-bottom-width:2px}
  #msg{margin:0;min-height:1.5em;font-size:.9375rem}
  dl{margin:0;display:grid;gap:22px}
  dt{font-size:.875rem;color:var(--stone)}
  dd{margin:2px 0 0;font-size:1.0625rem}

  footer{background:var(--deep);color:#E4E3DF;padding:48px var(--pad) 40px;font-size:.875rem}
  footer .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px}
  footer p{margin:0 0 6px;max-width:60ch}
  footer .mark{color:#fff;font-size:1.75rem}
  .dim{color:#B5B3AD}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="notice" data-t="notice"></div>

<header class="top">
  <div class="wrap bar">
    <a class="mark" href="#top">Minha</a>
    <nav class="links" aria-label="Main">
      <a href="#collections" data-t="nav1"></a>
      <a href="#lookbook" data-t="nav2"></a>
      <a href="#fitting" data-t="nav3"></a>
      <a href="#book" data-t="nav4"></a>
    </nav>
    <div class="tools"><button class="lang" id="langBtn" type="button" aria-label="Switch language"></button></div>
  </div>
</header>

<main id="top">
  <section class="hero" style="padding:0">
    <span class="ph-note" data-t="photoHero"></span>
    <div class="hero-in">
      <h1 class="word">Minha</h1>
      <p class="sub" data-t="sub"></p>
      <div class="cta-row">
        <a class="btn" href="#book" data-t="cta"></a>
        <a class="link" href="#collections" data-t="viewColl"></a>
      </div>
    </div>
  </section>

  <section class="wrap statement">
    <p data-t="statement"></p>
  </section>

  <section class="wrap coll" id="collections">
    <div>
      <h2 data-t="collTitle"></h2>
      <ul class="rows" id="rows"></ul>
    </div>
    <div class="preview" id="preview" aria-live="polite"><small id="previewCap"></small></div>
  </section>

  <section class="wrap look" id="lookbook" style="padding-top:0">
    <h2 data-t="lookTitle"></h2>
    <div class="look-grid">
      <div class="frame f1" data-t="photo"></div>
      <div class="frame f2" data-t="photo"></div>
      <div class="frame f3" data-t="photo"></div>
      <div class="frame f4" data-t="photo"></div>
      <div class="frame f5" data-t="photo"></div>
    </div>
  </section>

  <section class="steps" id="fitting">
    <div class="wrap">
      <h2 data-t="stepsTitle"></h2>
      <ol>
        <li><span class="n">1</span><div><h3 data-t="s1h"></h3><p data-t="s1p"></p></div></li>
        <li><span class="n">2</span><div><h3 data-t="s2h"></h3><p data-t="s2p"></p></div></li>
        <li><span class="n">3</span><div><h3 data-t="s3h"></h3><p data-t="s3p"></p></div></li>
      </ol>
    </div>
  </section>

  <section class="wrap book" id="book">
    <div class="book-grid">
      <div>
        <h2 data-t="bookTitle"></h2>
        <form id="form" novalidate>
          <label><span data-t="fName"></span><input id="fName" name="name" autocomplete="name" required></label>
          <label><span data-t="fPhone"></span><input id="fPhone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required></label>
          <label><span data-t="fDate"></span><input id="fDate" name="date" type="date"></label>
          <label><span data-t="fOcc"></span>
            <select id="fOcc" name="occasion">
              <option value="wedding" data-t="o1"></option>
              <option value="engagement" data-t="o2"></option>
              <option value="evening" data-t="o3"></option>
              <option value="other" data-t="o4"></option>
            </select>
          </label>
          <label><span data-t="fNote"></span><textarea id="fNote" name="note"></textarea></label>
          <div><button class="btn" type="submit" data-t="send"></button></div>
          <p id="msg" role="status"></p>
        </form>
      </div>
      <dl>
        <div><dt data-t="dAddr"></dt><dd data-t="vAddr"></dd></div>
        <div><dt data-t="dHours"></dt><dd data-t="vHours"></dd></div>
        <div><dt data-t="dWa"></dt><dd data-t="vWa"></dd></div>
        <div><dt data-t="dIg"></dt><dd data-t="vIg"></dd></div>
      </dl>
    </div>
  </section>
</main>

<footer>
  <div class="row">
    <div>
      <div class="mark">Minha</div>
      <p class="dim" data-t="foot"></p>
    </div>
    <div>
      <p data-t="cr"></p>
      <p class="dim" data-t="credit"></p>
    </div>
  </div>
</footer>

<script>
(function(){
  var T = {
    en:{
      notice:"Concept demo. Sample text and placeholder images. Not the official Minha website.",
      nav1:"Collections", nav2:"Lookbook", nav3:"Fittings", nav4:"Book",
      sub:"Bridal and Fashion Studio, Doha.",
      cta:"Book a consultation", viewColl:"View collections",
      photoHero:"Placeholder for hero photo", photo:"Photo",
      statement:"Gowns and occasion wear, with a private fitting for every bride.",
      collTitle:"Collections",
      lookTitle:"Lookbook",
      stepsTitle:"How a fitting works",
      s1h:"Consultation", s1p:"Tell us the date, the venue and the feeling you want. We pick a few gowns to try.",
      s2h:"Fittings", s2p:"Try the gowns on in private. Adjustments are planned around your date.",
      s3h:"Collection", s3p:"Your gown is checked one last time and handed over ready to wear.",
      bookTitle:"Book a consultation",
      fName:"Full name", fPhone:"Phone or WhatsApp", fDate:"Preferred date", fOcc:"Occasion", fNote:"Anything we should know",
      o1:"Wedding", o2:"Engagement", o3:"Evening event", o4:"Other",
      send:"Request appointment",
      sentDemo:"Demo only. This form does not send anything yet.",
      needFields:"Add your name and phone number to continue.",
      dAddr:"Studio", vAddr:"Address to be confirmed, Doha",
      dHours:"Hours", vHours:"Opening hours to be confirmed",
      dWa:"WhatsApp", vWa:"+974 0000 0000",
      dIg:"Instagram", vIg:"@minha (to be confirmed)",
      foot:"Bridal and Fashion Studio, Doha.",
      cr:"Commercial Register no.: pending",
      credit:"Concept demo designed by Gumball. Replace all sample text and photos before any real use.",
      lang:"العربية"
    },
    ar:{
      notice:"نموذج تصميم تجريبي. النصوص والصور مؤقتة، وليس الموقع الرسمي لمنها.",
      nav1:"المجموعات", nav2:"المعرض", nav3:"القياس", nav4:"احجزي",
      sub:"استوديو للعرائس والأزياء في الدوحة.",
      cta:"احجزي استشارة", viewColl:"تصفحي المجموعات",
      photoHero:"مكان صورة الغلاف", photo:"صورة",
      statement:"فساتين زفاف وأزياء مناسبات، مع موعد قياس خاص لكل عروس.",
      collTitle:"المجموعات",
      lookTitle:"المعرض",
      stepsTitle:"كيف يتم موعد القياس",
      s1h:"الاستشارة", s1p:"أخبرينا بالتاريخ والمكان والإحساس الذي تريدينه، ونختار لك عدة فساتين لتجربتها.",
      s2h:"القياس", s2p:"جربي الفساتين في أجواء خاصة، وتُرتّب التعديلات حسب موعد مناسبتك.",
      s3h:"الاستلام", s3p:"نراجع فستانك مرة أخيرة ونسلمه لك جاهزًا للارتداء.",
      bookTitle:"احجزي استشارة",
      fName:"الاسم الكامل", fPhone:"الهاتف أو واتساب", fDate:"التاريخ المفضل", fOcc:"المناسبة", fNote:"أي ملاحظات",
      o1:"زفاف", o2:"خطوبة", o3:"سهرة", o4:"أخرى",
      send:"اطلبي موعدًا",
      sentDemo:"نموذج تجريبي فقط. هذا النموذج لا يرسل أي شيء حاليًا.",
      needFields:"أضيفي اسمك ورقم هاتفك للمتابعة.",
      dAddr:"الاستوديو", vAddr:"العنوان سيُحدد لاحقًا، الدوحة",
      dHours:"ساعات العمل", vHours:"ساعات العمل ستُحدد لاحقًا",
      dWa:"واتساب", vWa:"+974 0000 0000",
      dIg:"إنستغرام", vIg:"@minha (سيُحدد لاحقًا)",
      foot:"استوديو للعرائس والأزياء في الدوحة.",
      cr:"رقم السجل التجاري: قيد الإضافة",
      credit:"نموذج تصميم تجريبي من Gumball. يجب استبدال كل النصوص والصور قبل أي استخدام فعلي.",
      lang:"English"
    }
  };
  var COLL = [
    {en:"Bridal gowns", ar:"فساتين الزفاف", ne:"Collection", na:"المجموعة", c:"#E6E3DD"},
    {en:"Evening wear", ar:"فساتين السهرة", ne:"Collection", na:"المجموعة", c:"#D5D2CB"},
    {en:"Bridesmaids", ar:"وصيفات العروس", ne:"Collection", na:"المجموعة", c:"#C4C1BA"},
    {en:"Veils and accessories", ar:"الطرحات والإكسسوارات", ne:"Collection", na:"المجموعة", c:"#DDDBD6"}
  ];
  var lang = "en", sel = 0;
  function $(id){return document.getElementById(id)}
  function t(k){return T[lang][k]}

  function renderRows(){
    var ul = $("rows"); ul.innerHTML = "";
    COLL.forEach(function(c,i){
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("aria-pressed", i === sel ? "true" : "false");
      b.innerHTML = c[lang] + "<span>" + (lang==="ar" ? c.na : c.ne) + "</span>";
      function pick(){ sel = i; paintPreview(); Array.prototype.forEach.call(ul.querySelectorAll("button"), function(x,j){ x.setAttribute("aria-pressed", j===i ? "true":"false"); }); }
      b.addEventListener("mouseenter", pick); b.addEventListener("focus", pick); b.addEventListener("click", pick);
      li.appendChild(b); ul.appendChild(li);
    });
    paintPreview();
  }
  function paintPreview(){
    var c = COLL[sel];
    $("preview").style.background = c.c;
    $("previewCap").textContent = t("photo") + ": " + c[lang];
  }

  function applyLang(){
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function(el){ el.textContent = t(el.getAttribute("data-t")); });
    $("langBtn").textContent = t("lang");
    $("msg").textContent = "";
    renderRows();
    try{ localStorage.setItem("minha-lang", lang); }catch(e){}
  }

  $("langBtn").addEventListener("click", function(){ lang = lang === "en" ? "ar" : "en"; applyLang(); });
  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    var ok = $("fName").value.trim() && $("fPhone").value.trim();
    $("msg").textContent = ok ? t("sentDemo") : t("needFields");
  });

  try{ var s = localStorage.getItem("minha-lang"); if(s === "ar" || s === "en") lang = s; }catch(e){}
  applyLang();
})();
</script>
</body>
</html>
