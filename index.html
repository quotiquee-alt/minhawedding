<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Bridal and Fashion Studio (concept demo)</title>
<meta name="description" content="Concept demo of a bilingual bridal boutique website. Placeholder images and sample text.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Jost:wght@300;400&family=Noto+Naskh+Arabic:wght@400;500&family=Noto+Sans+Arabic:wght@300;400&display=swap" rel="stylesheet">
<style>
  /* PHOTO SLOTS: put photos in an "images" folder with these names and they replace the placeholders.
     hero.jpg  bridal.jpg  evening.jpg  bridesmaids.jpg  accessories.jpg  studio.jpg */
  :root{
    --paper:#FAFAF8; --ink:#1B1B1B; --stone:#65635E; --rule:#DEDDD8; --band:#F0EFEB; --deep:#1F1F1E;
    --err:#9B2C2C; --ok:#2F5D46;
    --serif:"Bodoni Moda","Times New Roman",serif; --sans:"Jost",system-ui,sans-serif;
    --pad:clamp(20px,4.5vw,56px);
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  :root[lang="ar"]{ --serif:"Noto Naskh Arabic","Times New Roman",serif; --sans:"Noto Sans Arabic",system-ui,sans-serif; }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:84px}
  body{margin:0;background:var(--paper);color:var(--ink);font:300 1rem/1.75 var(--sans);-webkit-font-smoothing:antialiased}
  :root[lang="ar"] body{line-height:1.95}
  a{color:inherit}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .wrap{padding-inline:var(--pad)}
  h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
  .ph{background-image:var(--img),repeating-linear-gradient(103deg,rgba(255,255,255,.07) 0 70px,rgba(0,0,0,.012) 70px 160px),radial-gradient(120% 90% at 28% 12%,rgba(255,255,255,.6),transparent 62%),linear-gradient(172deg,var(--a),var(--b));background-size:cover;background-position:center;--a:#E9E6E0;--b:#CFCBC3}
  .caps{font-size:.8125rem;letter-spacing:.12em;text-transform:uppercase}
  :root[lang="ar"] .caps{letter-spacing:0;text-transform:none;font-size:.9375rem}
  .skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--ink);color:#fff;padding:10px 16px;z-index:100;text-decoration:none}
  .skip:focus{top:12px}
  .swap main,.swap footer{opacity:0}
  main,footer{transition:opacity .14s ease}

  .notice{background:var(--deep);color:#E9E8E4;font-size:.8125rem;padding:8px var(--pad);text-align:center}

  /* header */
  header.top{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--rule);transition:box-shadow .3s ease}
  header.top.scrolled{box-shadow:0 8px 24px -16px rgba(0,0,0,.25)}
  .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:68px;gap:12px;transition:min-height .3s var(--ease)}
  header.scrolled .bar{min-height:58px}
  .mark{font-family:"Bodoni Moda",serif;font-size:1.75rem;line-height:1;text-decoration:none;direction:ltr;text-align:center;letter-spacing:.02em}
  .mark small{display:block;font:300 .6875rem/1.4 var(--sans);letter-spacing:.14em;margin-top:6px;color:var(--stone);white-space:nowrap;transition:opacity .3s,max-height .3s;max-height:20px;overflow:hidden}
  header.scrolled .mark small{opacity:0;max-height:0;margin-top:0}
  :root[lang="ar"] .mark small{letter-spacing:0;font-size:.75rem}
  nav.links{display:none;gap:30px}
  nav.links a{text-decoration:none;padding:8px 0;border-bottom:1px solid transparent;transition:border-color .25s}
  nav.links a:hover{border-color:var(--ink)}
  .menu-btn{justify-self:start;background:none;border:0;cursor:pointer;min-height:44px;padding:0;color:inherit;display:inline-flex;align-items:center;gap:10px}
  .burger{width:20px;height:9px;position:relative;display:inline-block}
  .burger::before,.burger::after{content:"";position:absolute;inset-inline:0;height:1px;background:currentColor;transition:transform .3s var(--ease)}
  .burger::before{top:0}.burger::after{bottom:0}
  .menu-btn[aria-expanded="true"] .burger::before{transform:translateY(4px) rotate(45deg)}
  .menu-btn[aria-expanded="true"] .burger::after{transform:translateY(-4px) rotate(-45deg)}
  .tools{display:flex;justify-content:flex-end;align-items:center;gap:22px}
  .tools a{text-decoration:none;min-height:44px;display:none;align-items:center}
  .lang{background:none;border:0;cursor:pointer;min-height:44px;padding:0 2px;color:inherit}
  @media(min-width:900px){nav.links{display:flex}.menu-btn{display:none}.tools a{display:inline-flex}}

  @media(max-width:480px){
    .bar{gap:6px}
    .mark small{letter-spacing:.06em}
    .tools{gap:2px}
    .menu-btn{gap:8px}
  }
  .menu{position:fixed;inset:0;z-index:35;background:var(--paper);padding:120px var(--pad) 40px;display:flex;flex-direction:column;gap:6px;opacity:0;visibility:hidden;transform:translateY(-12px);transition:opacity .35s var(--ease),transform .35s var(--ease),visibility 0s .35s}
  .menu.open{opacity:1;visibility:visible;transform:none;transition:opacity .35s var(--ease),transform .35s var(--ease)}
  .menu a{font-family:var(--serif);font-size:2rem;text-decoration:none;padding:12px 0;border-bottom:1px solid var(--rule)}
  .menu a.btn{margin-top:28px;font-family:var(--sans);font-size:.8125rem;padding:0 30px;border-bottom:1px solid var(--ink);color:#fff}
  .menu a.btn:hover{color:var(--ink)}
  @media(min-width:900px){.menu{display:none}}

  /* buttons */
  .btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 30px;background:#fff;color:var(--ink);text-decoration:none;border:1px solid #fff;cursor:pointer;transition:color .35s var(--ease),border-color .35s,transform .15s}
  .btn::before{content:"";position:absolute;inset:0;background:var(--ink);transform:translateX(-101%);transition:transform .45s var(--ease);z-index:0}
  :root[dir="rtl"] .btn::before{transform:translateX(101%)}
  .btn>*{position:relative;z-index:1}
  .btn{isolation:isolate}
  .btn:hover::before,.btn:focus-visible::before,:root[dir="rtl"] .btn:hover::before,:root[dir="rtl"] .btn:focus-visible::before{transform:none}
  .btn:hover,.btn:focus-visible{color:#fff;border-color:var(--ink)}
  .btn:active{transform:scale(.98)}
  .btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.dark::before{background:#fff}
  .btn.dark:hover,.btn.dark:focus-visible{color:var(--ink)}
  .btn.line{background:transparent;color:var(--ink);border-color:var(--ink)}
  .btn.line:hover,.btn.line:focus-visible{color:#fff}
  .btn[disabled],.btn[aria-busy="true"]{pointer-events:none;opacity:.75}
  .spin{width:16px;height:16px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:none}
  .btn[aria-busy="true"] .spin{display:inline-block}
  .link{text-underline-offset:6px;background:none;border:0;cursor:pointer;color:inherit;padding:0;min-height:44px}

  /* hero */
  .hero{background-position:74% center;position:relative;min-height:min(82svh,820px);min-height:min(82dvh,820px);display:flex;align-items:flex-end;--img:url(images/hero.jpg);--a:#ECE9E3;--b:#C9C5BC;overflow:hidden;isolation:isolate;padding:0}
  .hero::before{content:"";position:absolute;inset:0;z-index:-1;background:inherit;background-image:inherit;animation:settle 2.6s var(--ease) both}
  .hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(20,20,20,.58),rgba(20,20,20,0) 58%)}
  .hero-in{padding:0 var(--pad) clamp(28px,5vw,64px);color:#fff;max-width:780px}
  .mask{overflow:hidden;padding-bottom:.12em}
  .hero h1{font-size:clamp(2.25rem,6.2vw,4.75rem);line-height:1.04;letter-spacing:-.01em}
  .hero h1 span{display:block;transform:translateY(108%);animation:up 1.2s .35s var(--ease) forwards}
  :root[lang="ar"] .hero h1{line-height:1.4;letter-spacing:0}
  .hero .cta-row{display:flex;flex-wrap:wrap;gap:14px 28px;margin-top:26px;align-items:center;opacity:0;animation:fade 1s 1.1s ease forwards}
  .hero .link{color:#fff}
  .reassure{margin:14px 0 0;font-size:.9375rem;color:#ECEAE5;opacity:0;animation:fade 1s 1.3s ease forwards}
  @keyframes settle{from{transform:scale(1.06)}to{transform:none}}
  @keyframes up{to{transform:none}}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}

  section{padding-block:clamp(64px,9vw,128px)}
  .statement p{font-family:var(--serif);font-size:clamp(1.625rem,3.6vw,2.75rem);line-height:1.28;margin:0 auto;max-width:28ch;text-align:center}
  :root[lang="ar"] .statement p{line-height:1.7}
  h2.sec{font-size:clamp(1.5rem,2.6vw,2rem);text-align:center;margin-bottom:clamp(28px,4vw,48px)}

  /* collection tiles */
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 14px}
  @media(min-width:900px){.tiles{grid-template-columns:repeat(4,1fr);gap:24px}}
  .tile a{display:block;text-decoration:none}
  .tile .frame{overflow:hidden;aspect-ratio:3/4}
  .tile .ph{width:100%;height:100%;transition:transform 1.1s var(--ease)}
  .tile a:hover .ph,.tile a:focus-visible .ph{transform:scale(1.05)}
  .tile h3{font-size:1.25rem;margin:16px 0 4px}
  .tile .go{display:inline-block;color:var(--stone);background:linear-gradient(var(--ink),var(--ink)) 0 100%/0 1px no-repeat;padding-bottom:3px;transition:background-size .5s var(--ease),color .3s}
  :root[dir="rtl"] .tile .go{background-position:100% 100%}
  .tile a:hover .go,.tile a:focus-visible .go{background-size:100% 1px;color:var(--ink)}
  .t1{--img:url(images/bridal.jpg);--a:#EEEBE5;--b:#D6D2CA}
  .t2{--img:url(images/evening.jpg);--a:#DAD6CF;--b:#B9B4AB}
  .t3{--img:url(images/bridesmaids.jpg);--a:#E4E1DB;--b:#C8C4BB}
  .t4{--img:url(images/accessories.jpg);--a:#F0EEE9;--b:#D9D5CD}

  /* studio feature */
  .feature{background:var(--band)}
  .feature-in{display:grid;gap:36px;align-items:center}
  @media(min-width:900px){.feature-in{grid-template-columns:1fr 1fr;gap:96px}}
  .feature .ph{aspect-ratio:4/5;--img:url(images/studio.jpg);--a:#E6E2DB;--b:#C5C0B6}
  .feature h2{font-size:clamp(1.75rem,3.4vw,2.75rem);line-height:1.15;margin-bottom:20px}
  :root[lang="ar"] .feature h2{line-height:1.5}
  .feature p{max-width:44ch;color:var(--stone);margin:0 0 28px}
  .row{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}

  /* proof */
  .proof{padding-block:clamp(40px,6vw,72px);border-block:1px solid var(--rule)}
  .proof-in{display:grid;gap:28px;text-align:center}
  @media(min-width:900px){.proof-in{grid-template-columns:repeat(3,1fr);gap:48px}}
  .proof blockquote{margin:0;font-family:var(--serif);font-size:1.25rem;line-height:1.4}
  :root[lang="ar"] .proof blockquote{line-height:1.8}
  .proof cite{display:block;margin-top:12px;font:300 .8125rem var(--sans);color:var(--stone);font-style:normal}

  /* steps */
  .steps ol{list-style:none;margin:0;padding:0;display:grid;border-top:1px solid var(--rule)}
  .steps li{display:grid;grid-template-columns:44px 1fr;gap:8px 16px;padding:26px 0;border-bottom:1px solid var(--rule)}
  @media(min-width:900px){.steps ol{grid-template-columns:repeat(3,1fr);gap:48px;border-top:0}.steps li{display:block;padding:22px 0 0;border-bottom:0;border-top:1px solid var(--ink)}}
  .steps .n{font-family:"Bodoni Moda",serif;font-size:1.125rem;color:var(--stone)}
  .steps h3{font-size:1.5rem;margin-bottom:8px}
  .steps p{margin:0;color:var(--stone);max-width:36ch}

  [hidden]{display:none!important}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .hint{margin:0 0 14px;color:var(--stone);font-size:.9375rem}

  /* header bag */
  .cart-btn{position:relative;background:none;border:0;cursor:pointer;color:inherit;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .badge{position:absolute;top:5px;inset-inline-end:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ink);color:#fff;font:400 .6875rem/17px var(--sans);text-align:center}
  .badge.bump{animation:bump .45s var(--ease)}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}

  /* shop */
  .shop-sub{text-align:center;margin:0 auto 40px;color:var(--stone);max-width:48ch}
  .shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:32px 14px}
  @media(min-width:900px){.shop-grid{grid-template-columns:repeat(3,1fr);gap:48px 24px}}
  .pitem .frame{overflow:hidden;aspect-ratio:4/5;margin-bottom:14px}
  .pitem .ph{width:100%;height:100%;transition:transform 1.1s var(--ease)}
  .pitem:hover .ph{transform:scale(1.04)}
  .pitem h3{font-size:1.125rem;line-height:1.3}
  .pitem .price{margin:2px 0 14px;color:var(--stone)}
  .pitem .btn{width:100%;min-height:46px;padding:0 12px}
  .btn[data-state="added"]{background:var(--ok);border-color:var(--ok);color:#fff}
  .shop-note{text-align:center;color:var(--stone);font-size:.875rem;margin:32px 0 0}
  .pr1{--img:url(images/p1.jpg);--a:#EFECE6;--b:#D8D3CA}
  .pr2{--img:url(images/p2.jpg);--a:#E8E5DF;--b:#CBC6BC}
  .pr3{--img:url(images/p3.jpg);--a:#F1EFEA;--b:#DCD8CF}
  .pr4{--img:url(images/p4.jpg);--a:#EAE7E1;--b:#D0CBC1}
  .pr5{--img:url(images/p5.jpg);--a:#E3DFD8;--b:#C7C2B8}
  .pr6{--img:url(images/p6.jpg);--a:#EEEBE5;--b:#D5D0C6}

  /* bag drawer */
  .overlay{position:fixed;inset:0;background:rgba(20,20,20,.45);opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s;z-index:55}
  .overlay.open{opacity:1;visibility:visible;transition:opacity .35s ease}
  .drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);background:var(--paper);z-index:60;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s}
  :root[dir="rtl"] .drawer{transform:translateX(-100%)}
  .drawer.open,:root[dir="rtl"] .drawer.open{transform:none;visibility:visible;transition:transform .45s var(--ease)}
  .d-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 14px 24px;border-bottom:1px solid var(--rule)}
  :root[dir="rtl"] .d-head{padding:14px 24px 14px 20px}
  .d-head h2{font-size:1.5rem}
  .d-close{background:none;border:0;cursor:pointer;color:inherit;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  .d-body{flex:1;overflow:auto;padding:8px 24px 28px}
  .d-foot{padding:18px 24px 22px;border-top:1px solid var(--rule);background:var(--paper)}
  .stot{display:flex;justify-content:space-between;align-items:baseline;font-size:1.0625rem}
  .empty{text-align:center;padding:64px 8px}
  .empty h3{font-size:1.5rem;margin-bottom:8px}
  .empty p{color:var(--stone);margin:0 0 24px}
  .crow{display:grid;grid-template-columns:72px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--rule)}
  .crow .ph{aspect-ratio:4/5}
  .cname{margin:0;font-family:var(--serif);font-size:1.0625rem;line-height:1.3}
  .cprice{margin:2px 0 10px;color:var(--stone);font-size:.9375rem}
  .ctl{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .qty{display:inline-flex;align-items:center;border:1px solid var(--rule)}
  .qty button{width:40px;height:40px;background:none;border:0;cursor:pointer;font-size:1.125rem;color:var(--ink);transition:background .2s}
  .qty button:hover{background:var(--band)}
  .qty span{min-width:30px;text-align:center}
  .ctl .link{min-height:40px;font-size:.875rem;color:var(--stone)}
  .osum{margin:6px 0 24px;border-top:1px solid var(--rule)}
  .osum div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:.9375rem}
  .osum div:last-child{font-size:1.0625rem}
  #vCheckout h3.sm{font-size:1.125rem;margin:18px 0 0}
  #vDone .tick{margin-top:24px}

  /* faq */
  .faq{max-width:760px;margin-inline:auto}
  .faq-item{border-bottom:1px solid var(--rule)}
  .faq-item:first-of-type{border-top:1px solid var(--rule)}
  .faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:0;cursor:pointer;text-align:start;padding:22px 0;min-height:60px;color:var(--ink);font-family:var(--serif);font-size:1.25rem}
  .faq-q i{width:14px;height:14px;position:relative;flex:none}
  .faq-q i::before,.faq-q i::after{content:"";position:absolute;background:currentColor;inset-inline:0;top:50%;height:1px;transition:transform .35s var(--ease)}
  .faq-q i::after{transform:rotate(90deg)}
  .faq-q[aria-expanded="true"] i::after{transform:rotate(0)}
  .faq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
  .faq-a>div{overflow:hidden}
  .faq-a p{margin:0 0 22px;color:var(--stone);max-width:56ch}
  .faq-q[aria-expanded="true"]+.faq-a{grid-template-rows:1fr}

  /* booking */
  .book{background:var(--band)}
  .book-grid{display:grid;gap:56px}
  @media(min-width:900px){.book-grid{grid-template-columns:1.1fr .9fr;gap:96px}}
  .book h2{font-size:clamp(1.75rem,3vw,2.25rem);margin-bottom:10px}
  .terms{margin:0 0 28px;color:var(--stone);font-size:.9375rem;max-width:52ch}
  .card{background:var(--paper);border:1px solid var(--rule);padding:clamp(22px,4vw,40px);max-width:560px}
  .stepmeta{display:flex;justify-content:space-between;font-size:.875rem;color:var(--stone);margin-bottom:10px}
  .prog{height:2px;background:var(--rule);margin-bottom:28px}
  .prog i{display:block;height:100%;width:50%;background:var(--ink);transition:width .5s var(--ease)}
  .panel[hidden]{display:none}
  .panel{animation:panelIn .45s var(--ease) both}
  @keyframes panelIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
  :root[dir="rtl"] .panel{animation-name:panelInRtl}
  @keyframes panelInRtl{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
  .panel h3{font-size:1.5rem;margin-bottom:6px}
  .panel .sub{margin:0 0 22px;color:var(--stone);font-size:.9375rem}
  fieldset{border:0;padding:0;margin:0 0 22px}
  legend{font-size:.9375rem;color:var(--stone);padding:0;margin-bottom:10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{position:relative}
  .chip input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
  .chip span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid var(--rule);background:#fff;font-size:.9375rem;transition:background .25s,color .25s,border-color .25s,transform .15s}
  .chip:hover span{border-color:var(--ink)}
  .chip input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip input:focus-visible+span{outline:2px solid var(--ink);outline-offset:3px}
  .chip:active span{transform:scale(.97)}
  .field{display:grid;gap:6px;margin-bottom:20px}
  .field label{font-size:.9375rem;color:var(--stone)}
  .field input,.field textarea{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:10px 0;min-height:48px;width:100%;transition:border-color .25s}
  .field textarea{min-height:84px;resize:vertical}
  .field input:focus,.field textarea:focus{outline:0;border-bottom-width:2px;padding-bottom:9px}
  .field[data-state="invalid"] input{border-color:var(--err)}
  .field[data-state="valid"] input{border-color:var(--ok)}
  .err{margin:0;font-size:.875rem;color:var(--err);min-height:0;display:none}
  .field[data-state="invalid"] .err{display:block;animation:fade .3s ease both}
  .actions{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-top:8px}
  .warn{margin:16px 0 0;font-size:.9375rem;color:var(--err);display:none}
  .warn.show{display:block}
  .tick{width:56px;height:56px;margin-bottom:18px}
  .tick circle,.tick path{fill:none;stroke:var(--ok);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tick circle{stroke-dasharray:160;stroke-dashoffset:160;animation:draw .8s var(--ease) forwards}
  .tick path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .6s var(--ease) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .summary{margin:20px 0 24px;display:grid;gap:10px;border-top:1px solid var(--rule);padding-top:18px}
  .summary div{display:flex;gap:14px;font-size:.9375rem}
  .summary dt{color:var(--stone);min-width:96px}
  .summary dd{margin:0;word-break:break-word}
  dl.info{margin:0;display:grid;gap:24px;align-content:start}
  dl.info dt{color:var(--stone)}
  dl.info dd{margin:4px 0 0;font-size:1.0625rem}

  .note{text-align:center}
  .note h2{font-size:clamp(1.5rem,2.6vw,2rem);margin-bottom:10px}
  .note p{margin:0 auto 24px;color:var(--stone);max-width:40ch}
  .nform{display:flex;gap:12px;max-width:480px;margin:0 auto;flex-wrap:wrap;justify-content:center;align-items:flex-end}
  .nform .field{flex:1 1 220px;margin:0;text-align:start}
  .nmsg{margin:14px 0 0;min-height:1.5em;font-size:.9375rem}

  footer{background:var(--deep);color:#E4E3DF;padding:56px var(--pad) 36px;font-size:.9375rem}
  .cols{display:grid;gap:32px;grid-template-columns:1fr}
  @media(min-width:760px){.cols{grid-template-columns:1.4fr 1fr 1fr 1fr}}
  footer .mark{color:#fff;font-size:1.75rem;text-align:start}
  footer .mark small{color:#B7B5AF;opacity:1;max-height:20px}
  footer h4{margin:0 0 12px;font:400 .8125rem var(--sans);color:#B7B5AF}
  footer p{margin:0 0 6px}
  footer a{text-decoration:none}
  .dim{color:#B7B5AF}
  .legal{border-top:1px solid #3A3A38;margin-top:40px;padding-top:20px;font-size:.8125rem;color:#B7B5AF}

  /* sticky mobile bar: appears after the hero, hides while the form is on screen */
  .sticky{position:fixed;inset-inline:0;bottom:0;z-index:30;display:flex;gap:8px;padding:10px var(--pad);background:var(--paper);border-top:1px solid var(--rule);transform:translateY(110%);transition:transform .45s var(--ease)}
  .sticky.show{transform:none}
  .sticky .btn{flex:1;min-height:48px;padding:0 10px}
  @media(min-width:900px){.sticky{display:none}}

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
    html{scroll-behavior:auto}
    .hero h1 span{transform:none}.hero .cta-row,.reassure{opacity:1}
  }
</style>

      items.forEach(function(it){
        var p = prod(it.id), row = mk("div", "crow");
        var ph = mk("div", "ph " + p.c); ph.setAttribute("role", "img"); ph.setAttribute("aria-label", p[lang]);
        var info = mk("div"), ctl = mk("div", "ctl"), q = mk("div", "qty");
        var num = mk("span", "", String(it.qty));
        q.appendChild(qbtn("−", t("qtyMinus"), it.id, "minus", function(){ setQty(it.id, it.qty - 1, "minus"); }));
        q.appendChild(num);
        q.appendChild(qbtn("+", t("qtyPlus"), it.id, "plus", function(){ setQty(it.id, it.qty + 1, "plus"); }));
        var rm = mk("button", "link", t("remove")); rm.type = "button"; rm.addEventListener("click", function(){ setQty(it.id, 0); });
        ctl.appendChild(q); ctl.appendChild(rm);
        info.appendChild(mk("p", "cname", p[lang])); info.appendChild(mk("p", "cprice", money(p.price * it.qty))); info.appendChild(ctl);
        row.appendChild(ph); row.appendChild(info); box.appendChild(row);
      });
    }
    $("subtotal").textContent = money(sum(items));
    $("dFoot").hidden = view !== "cart" || !items.length;
    if(view === "checkout") renderCheckoutSummary();
  }
  function renderCheckoutSummary(){
    var box = $("coSummary"); box.innerHTML = "";
    var items = cartItems();
    items.forEach(function(it){
      var p = prod(it.id), r = mk("div");
      r.appendChild(mk("span", "", p[lang] + " × " + it.qty)); r.appendChild(mk("span", "", money(p.price * it.qty))); box.appendChild(r);
    });
    var tr = mk("div"); tr.appendChild(mk("strong", "", t("total"))); tr.appendChild(mk("strong", "", money(sum(items)))); box.appendChild(tr);
  }
  function setView(v){
    view = v;
    $("vCart").hidden = v !== "cart"; $("vCheckout").hidden = v !== "checkout"; $("vDone").hidden = v !== "done";
    $("drawerTitle").textContent = t(v === "cart" ? "bagTitle" : v === "checkout" ? "coTitle" : "doneTitle");
    $("fgCAddr").hidden = dmVal() !== "dmDel";
    $("pmNote").hidden = pmVal() !== "pmOnline";
    renderCart();
    if(v === "done") renderDone();
    $("dBody").scrollTop = 0;
  }
  function openDrawer(open){
    var d = $("drawer");
    if(open === d.classList.contains("open")) return;
    d.classList.toggle("open", open); $("overlay").classList.toggle("open", open);
    d.setAttribute("aria-hidden", open ? "false" : "true");
    document.body.style.overflow = open ? "hidden" : "";
    if(open){ lastFocus = document.activeElement; setTimeout(function(){ $("closeCart").focus(); }, 80); }
    else if(lastFocus && lastFocus.focus){ lastFocus.focus(); }
  }

  /* order text and confirmation, rendered in the current language */
  function orderText(o){
    var L = [t("orderMsgTitle") + " " + o.ref];
    o.items.forEach(function(it){ var p = prod(it.id); L.push(it.qty + " x " + p[lang] + ": " + money(p.price * it.qty)); });
    L.push(t("total") + ": " + money(o.total) + " (" + t("deliveryTbc") + ")");
    L.push(t("sName") + ": " + o.name);
    L.push(t("sPhone") + ": " + o.phone);
    L.push(t("lblDelivery") + ": " + (o.dm === "dmDel" ? t("dmDel") + ", " + o.addr : t("dmPick")));
    L.push(t("lblPay") + ": " + t(o.pm));
    L.push(t("sNote") + ": " + (o.note || t("none")));
    return L.join("\n");
  }
  function renderDone(){
    if(!lastOrder) return;
    var o = lastOrder;
    $("doneRef").textContent = t("doneRef") + ": " + o.ref;
    $("doneText").textContent = t(o.pm === "pmOnline" ? "doneOnline" : "doneCod");
    var dl = $("doneSummary"); dl.innerHTML = "";
    function row(a, b){ var r = mk("div"); r.appendChild(mk("dt", "", a)); r.appendChild(mk("dd", "", b)); dl.appendChild(r); }
    o.items.forEach(function(it){ var p = prod(it.id); row(p[lang] + " × " + it.qty, money(p.price * it.qty)); });
    row(t("total"), money(o.total));
    row(t("sName"), o.name);
    row(t("lblDelivery"), o.dm === "dmDel" ? t("dmDel") + ", " + o.addr : t("dmPick"));
    lastOrderText = orderText(o);
    $("waOrder").href = "https://wa.me/" + WA + "?text=" + encodeURIComponent(lastOrderText);
  }

  $("cartBtn").addEventListener("click", function(){ setView(view === "done" ? "done" : "cart"); openDrawer(true); });
  $("closeCart").addEventListener("click", function(){ openDrawer(false); });
  $("overlay").addEventListener("click", function(){ openDrawer(false); });
  $("toCheckout").addEventListener("click", function(){ setView("checkout"); $("cName").focus(); });
  $("backBag").addEventListener("click", function(){ setView("cart"); });
  $("doneBtn").addEventListener("click", function(){ setView("cart"); openDrawer(false); });
  $("dmChips").addEventListener("change", function(){ $("fgCAddr").hidden = dmVal() !== "dmDel"; });
  $("pmChips").addEventListener("change", function(){ $("pmNote").hidden = pmVal() !== "pmOnline"; });
  $("vCheckout").addEventListener("submit", function(e){
    e.preventDefault();
    if(!count()) return;
    var a = revalidate("fgCName"), b = revalidate("fgCPhone"), c = revalidate("fgCAddr");
    if(!a || !b || !c){ (!a ? $("cName") : !b ? $("cPhone") : $("cAddr")).focus(); return; }
    var items = cartItems();
    lastOrder = {
      ref: "MN-" + Date.now().toString(36).toUpperCase().slice(-6),
      items: items, total: sum(items),
      name: $("cName").value.trim(), phone: $("cPhone").value.trim(),
      dm: dmVal(), addr: $("cAddr").value.trim(), pm: pmVal(), note: $("cNote").value.trim()
    };
    var btn = $("placeBtn");
    btn.setAttribute("aria-busy", "true"); $("placeLabel").textContent = t("placing");
    var link = "https://wa.me/" + WA + "?text=" + encodeURIComponent(orderText(lastOrder));
    var win = window.open(link, "_blank");
    if(win){ try{ win.opener = null; }catch(err){} }
    setTimeout(function(){
      btn.removeAttribute("aria-busy"); $("placeLabel").textContent = t("place");
      cart = {}; saveCart();
      $("oBlocked").classList.toggle("show", !win);
      setView("done");
      $("waOrder").focus();
    }, 700);
  });
  $("copyOrder").addEventListener("click", function(){
    var done = function(ok){ $("copyMsg2").textContent = ok ? t("copied") : t("copyFail"); };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(lastOrderText).then(function(){ done(true); }, function(){ done(false); }); }
      else done(false);
    }catch(err){ done(false); }
  });
  document.addEventListener("keydown", function(e){
    if(!$("drawer").classList.contains("open")) return;
    if(e.key === "Escape"){ openDrawer(false); return; }
    if(e.key !== "Tab") return;
    var f = qsa('#drawer button:not([disabled]), #drawer a[href], #drawer input, #drawer textarea, #drawer select').filter(function(x){ return x.offsetParent !== null; });
    if(!f.length) return;
    if(e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length - 1].focus(); }
    else if(!e.shiftKey && document.activeElement === f[f.length - 1]){ e.preventDefault(); f[0].focus(); }
  });

  buildChips("whenChips","when",WHEN);
  buildChips("wantChips","want",WANT);
  buildChips("dmChips","dm",["dmDel","dmPick"]);
  buildChips("pmChips","pm",["pmOnline","pmCod"]);
  document.querySelector('input[name="dm"]').checked = true;
  document.querySelector('input[name="pm"]').checked = true;
  buildFaq();
  try{ var s = localStorage.getItem("minha-lang"); if(s === "ar" || s === "en") lang = s; }catch(e){}
  applyLang();
  showStep(1);
  document.body.setAttribute("data-ready","1");
})();
</script>
</body>
</html>
